name: RTX6000 BAR preflight test 2.4.3
on:
  workflow_dispatch:
  push:
    branches: [test/rtx6000-bar-preflight-v2.4.3]
permissions:
  contents: read
concurrency:
  group: bar-preflight-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
          fetch-depth: 1
      - name: Select matching Intel macOS toolchain
        run: |
          test "$(uname -m)" = x86_64
          if [ -d /Applications/Xcode_16.4.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          fi
          xcodebuild -version
          command -v gmake || brew install make
      - name: Test address limits and fault-inject preflight staging
        run: |
          mkdir -p build-out/logs
          set -o pipefail
          python3 ci/test-bar-preflight.py 2>&1 | tee build-out/logs/preflight-tests.log
      - name: Fetch pinned NVIDIA source and matching official patches
        run: |
          git clone --depth 1 --branch 610.57.04 https://github.com/NVIDIA/open-gpu-kernel-modules.git .deps/open-gpu-kernel-modules
          test "$(git -C .deps/open-gpu-kernel-modules rev-parse HEAD)" = e4a5faa2567f28c8eabe0ebb6422b6d0abcf37eb
          git -C .deps/open-gpu-kernel-modules apply ../../ci/patches/610-macos-version-headers.patch
          git -C .deps/open-gpu-kernel-modules apply ../../kexts/NVRM/patches/610-fsp-timer-double-destroy.patch
          git -C .deps/open-gpu-kernel-modules apply ../../kexts/NVRM/patches/610-display-completion.patch
          git -C .deps/open-gpu-kernel-modules apply --directory=src/nvidia-modeset ../../kexts/NVRM/patches/610-setmode-reason.patch
          git -C .deps/open-gpu-kernel-modules apply --directory=src/nvidia-modeset ../../kexts/NVRM/patches/610-backlight-register-log.patch
      - name: Build and link the native Intel kexts
        run: python3 ci/build-macos-kexts.py --vendor .deps/open-gpu-kernel-modules --output build-out --jobs 4
      - name: Replace only NVRM in the checksum-pinned official 2.4.3 package
        run: python3 ci/package-experiment.py --output build-out
      - name: Build matching offline 1401 App
        run: |
          git clone --depth 1 --branch v2.4.3 https://github.com/nullmoth/1401.git .deps/1401
          test "$(git -C .deps/1401 rev-parse HEAD)" = 485dfe26b6dc06bd6e2dec780db844633dfe7b49
          python3 ci/package-test-app.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtx6000-bar-preflight-2.4.3-${{ github.run_number }}
          path: |
            build-out/logs/
            build-out/build-proof.json
            build-out/installer-proof.json
            build-out/SHA256SUMS.txt
            build-out/nullmoth-2.4.3-rtx6000-bar-preflight-v1.tar.gz
            build-out/1401-Mac-2.4.3-RTX6000-BAR-Preflight-Test.zip
          if-no-files-found: warn
          retention-days: 14
